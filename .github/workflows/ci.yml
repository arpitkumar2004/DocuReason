name: CI Pipeline

on:
  push:
    branches: [ main, master, "release/*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-audit:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pip-audit

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .
        continue-on-error: true

      - name: Run Mypy Type Checker
        run: mypy docureason
        continue-on-error: true

      - name: Dependency Vulnerability Audit
        run: pip-audit --desc on --ignore-vuln GHSA-w596-4w93-559d || true

  test:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          # Several tests construct real Ranker / DenseIndexBuilder instances, which
          # download models. Without this cache every matrix leg re-downloads them and
          # a hub outage turns into a red build with no code change.
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Run pytest with coverage
        run: |
          pytest --cov=docureason --cov-report=xml --cov-report=term-missing tests/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  build-and-verify-package:
    name: Package Build & PyPI Metadata Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine check-wheel-contents

      - name: Build source distribution and wheel
        run: python -m build

      - name: Check package metadata with Twine
        run: twine check --strict dist/*

      - name: Inspect Wheel Contents
        # W005/W009 ignores dropped: the wheel now ships a single top-level package.
        run: check-wheel-contents dist/*.whl

      - name: Install wheel in a clean venv and exercise the entry points
        # The console script previously pointed at src.tripath.cli:main, a module that
        # does not exist, so `pip install docureason-framework && docureason` failed for
        # every user. Nothing in CI exercised it. This step closes that gap.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/docureason --help
          /tmp/smoke/bin/python -c "import docureason; print('version:', docureason.__version__)"

      - name: Upload Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
