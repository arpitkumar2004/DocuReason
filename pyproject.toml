[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docureason-framework" 
version = "1.1.1"
description = "DocuReason RAG: A Grounded Framework for Multimodal Document Retrieval and Reasoning. An Enterprise-Grade Tri-Path Multimodal RAG Framework for Text, Tables, and Visual Documents"
readme = "README.md"
authors = [{name = "Arpit Kumar", email = "arpitkumar2004@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["docureason", "rag", "multimodal", "retrieval", "duckdb", "eval", "nlp", "llm", "colpali", "vector-search"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",                 
    "transformers>=4.35.0",          
    "colpali-engine>=0.3.0",       
    "peft>=0.10.0",                  
    "accelerate>=0.28.0",             
    "qdrant-client>=1.8.0",
    "duckdb>=1.0.1",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "sentence-transformers>=2.2.0",
    "bm25s>=0.1.0",
    "docling>=2.0.0",
    "easyocr>=1.7.0",
    "uvicorn>=0.20.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0"
]
lint = [
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pip-audit>=2.6.0"
]
build = [
    "build>=1.0.0",
    "twine>=4.0.2",
    "wheel>=0.41.0"
]
dev = [
    "docureason-framework[test,lint,build]"
]

[project.scripts]
docureason = "src.tripath.cli:main"

[project.urls]
Homepage = "https://github.com/arpitkumar2004/DocuReason"
Documentation = "https://github.com/arpitkumar2004/DocuReason#readme"
Repository = "https://github.com/arpitkumar2004/DocuReason.git"
Changelog = "https://github.com/arpitkumar2004/DocuReason/blob/main/CHANGELOG.md"
Tracker = "https://github.com/arpitkumar2004/DocuReason/issues"
"Evaluation Spec" = "https://github.com/arpitkumar2004/DocuReason/blob/main/Documentations/eval_method.md"
"Dataset Benchmark Spec" = "https://github.com/arpitkumar2004/DocuReason/blob/main/Documentations/datasets_eval.md"
"Architecture Deep Dive" = "https://github.com/arpitkumar2004/DocuReason/blob/main/Documentations/all_about_project.md"
"System Robustness Report" = "https://github.com/arpitkumar2004/DocuReason/blob/main/Documentations/robust_sys.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["docureason*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:.*StarletteDeprecationWarning.*",
    "ignore:.*httpx.*",
    "ignore:.*quantization is deprecated.*",
    "ignore:.*quantize_per_tensor.*",
    "ignore:.*export_to_markdown.*",
    "ignore:.*generate_table_images.*",
    "ignore::DeprecationWarning:docling.*",
    "ignore::DeprecationWarning:easyocr.*",
    "ignore::DeprecationWarning:torch.*",
    "ignore::UserWarning:torch.*",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["scratch", "artifacts", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B905", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["docureason", "src"]

[tool.coverage.run]
source = ["src", "docureason"]
omit = ["tests/*", "scratch/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:"
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.check-wheel-contents]
ignore = ["W005", "W009"]

