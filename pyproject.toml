[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docureason"
version = "1.0.0"
description = "Tri-Path Multimodal RAG for enterprise documents"
requires-python = ">=3.10"
dependencies = [
    "torch==2.13.0",                 
    "transformers==5.14.1",          
    "colpali-engine==0.3.12",       
    "peft==0.18.2",                  
    "accelerate==1.1.4",             
    "qdrant-client==1.18.0",
    "duckdb==1.4.3",
    "fastapi==0.124.4",
    "pydantic==2.10.3",              
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*StarletteDeprecationWarning.*",
    "ignore:.*httpx.*",
    "ignore:.*quantization is deprecated.*",
    "ignore:.*quantize_per_tensor.*",
    "ignore:.*export_to_markdown.*",
    "ignore:.*generate_table_images.*",
    "ignore::DeprecationWarning:docling.*",
    "ignore::DeprecationWarning:easyocr.*",
    "ignore::DeprecationWarning:torch.*",
    "ignore::UserWarning:torch.*",
]
