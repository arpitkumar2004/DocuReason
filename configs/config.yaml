# ==============================================================================
# DocuReason v1.1.4 — Enterprise Tri-Path Multimodal RAG Configuration File
# ==============================================================================
# Master configuration file located in the centralized `configs/` directory.
# Overrides can be applied via:
# 1. Preset Profiles ('quality_max', 'balanced', 'latency_optimized', 'low_resource_cpu')
# 2. Environment Variables ('DOCUREASON_SECTION_KEY')
# 3. Dynamic REST API JSON payloads per query request

# Selected Production Preset Profile
preset: "balanced"

# Global Output & Artifact Storage Directory
output_dir: "artifacts"

# ------------------------------------------------------------------------------
# 1. Ingestion & Layout Parsing Layer
# ------------------------------------------------------------------------------
ingestion:
  ocr_fallback_char_threshold: 50   # Trigger EasyOCR if page text count < threshold
  page_batch_size: 1                # Page processing batch size for Docling
  image_rendering_dpi: 150          # Image resolution for OCR and vision rendering
  enable_ocr_fallback: true         # Automatic OCR fallback for scanned pages
  child_chunk_size: 256             # Dense vector search chunk token target
  parent_region_size: 1024          # Parent region expansion token target
  chunk_overlap: 32                 # Sentence chunk token overlap

# ------------------------------------------------------------------------------
# 2. Multi-Modal Indexing & FAISS HNSW Layer
# ------------------------------------------------------------------------------
indexing:
  domain: "general"                 # Presets: 'general', 'biomedical', 'legal', 'financial', 'code', 'multilingual'
  model_name: null                  # HuggingFace model override (if null, uses domain preset)
  # Commit pin for the embedding model. Leave null: docureason/tripath/model_pins.py
  # carries a pin per model *name*, so changing `domain` or `model_name` above picks
  # up the right commit (or none) instead of a mismatched one. Set a value here only
  # to override that registry, e.g. for a model it does not know.
  model_revision: null
  index_type: "hnsw"                # FAISS index type: 'flat' (exact inner-product) or 'hnsw' (approximate graph)
  hnsw_m: 32                        # HNSW bidirectional links per node (16-64)
  hnsw_ef_construction: 200         # HNSW search depth during graph construction (100-400)
  hnsw_ef_search: 64                # HNSW search depth during online query execution (32-128)
  bm25_k1: 1.5                      # BM25 term frequency saturation parameter
  bm25_b: 0.75                      # BM25 document length normalization parameter

# ------------------------------------------------------------------------------
# 3. Intent-Based Query Router Layer
# ------------------------------------------------------------------------------
router:
  threshold: 0.35                   # Modality activation sigmoid threshold (0.0 - 1.0)
  sigmoid_lambda: 1.2               # Keyword density sigmoid scaling multiplier
  modality_keywords:
    text:
      - "revenue"
      - "growth"
      - "report"
      - "overview"
      - "company"
      - "margin"
      - "statement"
      - "financial"
      - "narrative"
    table:
      - "table"
      - "region"
      - "quarter"
      - "by"
      - "revenue"
      - "sum"
      - "average"
      - "total"
      - "rate"
      - "percent"
    vision:
      - "chart"
      - "figure"
      - "image"
      - "graph"
      - "adoption"
      - "bar"
      - "pie"
      - "diagram"
      - "plot"
      - "trend"

# ------------------------------------------------------------------------------
# 4. Hybrid Tri-Path Retrieval & Late Fusion Layer
# ------------------------------------------------------------------------------
retrieval:
  top_k_text: 20                    # Initial candidate pool retrieved from Text path
  top_k_table: 20                   # Initial candidate pool retrieved from Table path
  top_k_vision: 20                  # Initial candidate pool retrieved from Vision path
  rrf_k: 60                         # Reciprocal Rank Fusion smoothing constant (k=60)
  enable_dynamic_router_weights: true # Dynamic weight allocation via router probabilities

# ------------------------------------------------------------------------------
# 5. Cross-Encoder Reranking & Context Layer
# ------------------------------------------------------------------------------
reranker:
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2" # Cross-Encoder model path
  model_revision: null              # null -> the pin registered for model_name in model_pins.py
  short_heading_char_threshold: 45   # Character threshold for standalone heading penalty
  heading_penalty_multiplier: 0.5   # Penalty factor applied to TOC/heading-only chunks
  final_top_k: 5                    # Final reranked candidates sent to LLM prompt
  enable_parent_expansion: true     # Expand child chunks to 1024-token parent regions

# ------------------------------------------------------------------------------
# 6. Multimodal Generation & Context Budget Layer
# ------------------------------------------------------------------------------
generation:
  backend: "auto"                   # Options: 'auto', 'slm', 'cloud', 'template'
  model_name_or_path: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  max_context_tokens: 4096          # Context window token budget limit
  truncation_strategy: "smart_relevance" # Truncation mode for multi-document evidence
  temperature: 0.1                  # Generation sampling temperature
  max_new_tokens: 512               # Max tokens generated in response

# ------------------------------------------------------------------------------
# 7. Sentence-Level NLI Faithfulness Attribution Layer
# ------------------------------------------------------------------------------
attribution:
  nli_model_name: "cross-encoder/nli-deberta-v3-small" # NLI DeBERTa entailment model
  entailment_threshold: 0.5         # Minimum probability to classify claim as entailed
  flag_threshold_precision: 0.5     # Response precision threshold to flag 'needs_review'
  enable_nli: true                  # Enable automated hallucination verification pass

# ------------------------------------------------------------------------------
# 8. Online Serving Layer
# ------------------------------------------------------------------------------
# These two settings previously lived in configs/serving.yaml, which load_from_yaml
# never read (it loads config.yaml only), so both described behaviour the service did
# not have.
serving:
  response_cache_size: 64           # Distinct (query, config) responses kept per service; 0 disables
  enable_parallel_paths: true       # Run the text/table/vision retrievers concurrently

# ------------------------------------------------------------------------------
# Ablation switches (Documentations/eval_method.md §21)
# ------------------------------------------------------------------------------
# Left at their defaults here and flipped per query by scripts/run_ablations.py. Each
# one names a component the ablation matrix claims a delta for; before these existed,
# four of the seven rows could not be measured because the component could not be
# turned off. Setting any of them to false is reported in the response `degradation`
# list, so an ablated run is never mistaken for a healthy one:
#
#   ingestion.enable_layout_parser     false -> rule-based segmentation (needs re-ingestion)
#   retrieval.enable_sparse_retrieval  false -> dense-only retrieval
#   retrieval.enable_table_sql         false -> no DuckDB text-to-SQL path
#   reranker.enable_cross_encoder      false -> token-similarity fallback reranker
#   reranker.enable_heading_penalty    false -> no short-heading penalty
#   reranker.enable_parent_expansion   false -> child chunks only
#   attribution.enable_nli             false -> no claim-support verification
